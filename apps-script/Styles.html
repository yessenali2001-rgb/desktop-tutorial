<style>
:root {
  /* Брендбук: қою көк #111233, құм түсті #CAB391 */
  --navy: #111233;
  --sand: #cab391;
  --bg: #f3f2ef;
  --surface: #ffffff;
  --surface-2: #f7f5f1;
  --ink: #111233;
  --muted: #5d5e73;
  --line: #e2ded6;
  --accent: #111233;
  --accent-ink: #ffffff;
  --gold: #cab391;
  --bar-bg: #111233;
  --bar-ink: #ffffff;
  --bar-muted: #cab391;
  --pending: #a86a00;
  --pending-bg: #fff3d6;
  --ok: #1d7a46;
  --ok-bg: #dcf3e5;
  --bad: #b3261e;
  --bad-bg: #fbe1df;
  --left: #3d5566;
  --left-bg: #e3eaef;
  --radius: 10px;
  /* Брендбук қарпі SF Pro Display: Apple құрылғыларында бар, басқаларында Inter */
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Inter", "Segoe UI", Roboto, Arial, sans-serif;
  --mono: var(--font);
  color-scheme: light;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0c20;
    --surface: #16173a;
    --surface-2: #1d1e45;
    --ink: #eeeaf2;
    --muted: #a3a2bb;
    --line: #2c2d57;
    --accent: #cab391;
    --accent-ink: #111233;
    --bar-bg: #16173a;
    --pending: #f2c25a;
    --pending-bg: #3a2e12;
    --ok: #6fd39b;
    --ok-bg: #143324;
    --bad: #f28b82;
    --bad-bg: #3a1a18;
    --left: #b3c3cf;
    --left-bg: #243542;
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 var(--font);
  -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: 1.5rem; }
h2 { font-size: 1.15rem; }
h3 { font-size: 1rem; }
.muted { color: var(--muted); margin: 0; }
.mono, time { font-variant-numeric: tabular-nums; }

/* ---------- Кнопкалар мен өрістер ---------- */
.btn {
  font: inherit;
  font-weight: 600;
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 0.55rem 1rem;
  cursor: pointer;
  background: var(--surface-2);
  color: var(--ink);
  transition: filter 0.15s, background 0.15s;
}
.btn:hover { filter: brightness(0.95); }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
  outline-offset: 1px;
}
.btn:disabled { opacity: 0.55; cursor: wait; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-ok { background: var(--ok); color: #fff; }
.btn-bad { background: transparent; color: var(--bad); border-color: currentColor; }
.btn-big { font-size: 1.05rem; padding: 0.8rem 1.3rem; }
@media (prefers-color-scheme: dark) { .btn-ok { color: #0b1a24; } }

label { font-weight: 600; font-size: 0.85rem; color: var(--muted); }
input, select, textarea {
  font: inherit;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 0.55rem 0.7rem;
  width: 100%;
}
textarea { resize: vertical; min-height: 3.5rem; }
.error { color: var(--bad); margin: 0; font-weight: 500; }
.stack { display: grid; gap: 0.5rem; }
.row-end { display: flex; gap: 0.5rem; justify-content: flex-end; flex-wrap: wrap; margin-top: 0.5rem; }

/* ---------- Кіру ---------- */
.login {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 16px;
}
.login-card {
  width: 100%;
  max-width: 420px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 28px 24px;
  display: grid;
  gap: 0.5rem;
  box-shadow: 0 10px 30px rgb(10 30 50 / 0.08);
}
.login-card .brand { margin-bottom: 0.75rem; }
.login-card .btn { margin-top: 0.5rem; }

.field-label { font-weight: 600; font-size: 0.85rem; color: var(--muted); }
.segmented {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 4px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 0.5rem;
}
.segmented input { position: absolute; opacity: 0; pointer-events: none; width: 1px; }
.segmented label {
  color: var(--ink);
  font-size: 0.85rem;
  text-align: center;
  padding: 0.55rem 0.25rem;
  border-radius: 7px;
  cursor: pointer;
  line-height: 1.2;
}
.segmented input:checked + label { background: var(--accent); color: var(--accent-ink); }
.segmented input:focus-visible + label { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); }
#login-secret { font-size: 1.1rem; letter-spacing: 0.15em; }

.school-name {
  margin: -0.25rem 0 0.75rem;
  padding: 0.6rem 0.75rem;
  font-size: 0.78rem;
  line-height: 1.45;
  color: var(--muted);
  background: var(--surface-2);
  border-left: 3px solid var(--gold);
  border-radius: 0 6px 6px 0;
  text-wrap: pretty;
}
.brand-text { display: grid; line-height: 1.2; }
.school-short { font-size: 0.75rem; color: var(--muted); font-weight: 500; }

.brand { display: flex; align-items: center; gap: 0.75rem; }
.brand-logo { width: 56px; height: 56px; flex: none; display: block; }
.brand.small .brand-logo { width: 38px; height: 38px; }
.login-card .brand { flex-direction: column; text-align: center; gap: 0.6rem; }
.login-card .brand-logo { width: 88px; height: 88px; }

/* ---------- Жоғарғы жолақ ---------- */
.topbar {
  background: var(--bar-bg);
  color: var(--bar-ink);
  border-bottom: 3px solid var(--sand);
  position: sticky;
  top: 0;
  z-index: 5;
}
.topbar-inner {
  max-width: 1180px;
  margin: 0 auto;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
}
.tabs { display: flex; gap: 0.25rem; flex: 1; flex-wrap: wrap; }
.tabs button {
  font: inherit;
  font-weight: 600;
  border: 0;
  background: transparent;
  color: color-mix(in srgb, var(--bar-ink) 70%, transparent);
  padding: 0.45rem 0.8rem;
  border-radius: 8px;
  cursor: pointer;
}
.tabs button[aria-current="page"] { background: color-mix(in srgb, var(--bar-ink) 12%, transparent); color: var(--bar-ink); box-shadow: inset 0 -2px 0 var(--sand); }
.topbar .school-short { color: var(--bar-muted); }
.topbar .btn-ghost { color: var(--bar-ink); border-color: color-mix(in srgb, var(--bar-ink) 30%, transparent); }
.who { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; margin-left: auto; }
@media (max-width: 600px) {
  .topbar-inner { gap: 0.5rem 1rem; padding-block: 8px; }
  .topbar .school-short { display: none; }
  .who { margin-left: 0; width: 100%; }
  .who #who-name { flex: 1; min-width: 0; }
}
.role-chip {
  font-size: 0.75rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--navy);
  background: var(--sand);
  padding: 0.15rem 0.5rem;
  border-radius: 99px;
}
.who .btn { padding: 0.35rem 0.7rem; font-size: 0.85rem; }

/* ---------- Мазмұн ---------- */
.content {
  max-width: 1180px;
  margin: 0 auto;
  padding: 20px 16px 48px;
  display: grid;
  gap: 1.25rem;
}
.page-head { display: flex; align-items: end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
.page-head input[type="date"] { width: auto; }

.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 20px;
}
.teacher-grid { display: grid; gap: 1.25rem; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); align-items: start; }
@media (max-width: 820px) { .teacher-grid { grid-template-columns: 1fr; } }

.form-grid { display: grid; gap: 0.75rem; grid-template-columns: 1fr 1fr; }
.form-grid .full { grid-column: 1 / -1; }
.form-grid > div { display: grid; gap: 0.3rem; }
@media (max-width: 420px) { .form-grid { grid-template-columns: 1fr; } }

.chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
.chips input { position: absolute; opacity: 0; pointer-events: none; width: 1px; }
.chips label {
  color: var(--ink);
  font-weight: 500;
  font-size: 0.9rem;
  border: 1px solid var(--line);
  border-radius: 99px;
  padding: 0.3rem 0.75rem;
  cursor: pointer;
  background: var(--surface);
}
.chips input:checked + label { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.chips input:focus-visible + label { outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent); }

/* ---------- Санауыштар ---------- */
.counters { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0.75rem; }
@media (max-width: 640px) { .counters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.counter {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 12px 14px;
  display: grid;
  gap: 0.1rem;
}
.counter b { font-family: var(--mono); font-size: 1.8rem; line-height: 1.1; }
.counter span { color: var(--muted); font-size: 0.85rem; font-weight: 500; }
.counter.pending b { color: var(--pending); }
.counter.approved b { color: var(--ok); }
.counter.left b { color: var(--left); }
.counter.rejected b { color: var(--bad); }

/* ---------- Өтінім карточкасы (рұқсат қағазы) ---------- */
.list { display: grid; gap: 0.75rem; }
.section-title { display: flex; align-items: baseline; gap: 0.5rem; margin-top: 0.5rem; }
.section-title .count { font-family: var(--mono); color: var(--muted); }

.slip {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 12px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 0.75rem 1.25rem;
  padding: 16px 18px;
  position: relative;
  overflow: hidden;
}
.slip::before {
  content: "";
  position: absolute;
  inset: 0 auto 0 0;
  width: 5px;
  background: var(--status-color, var(--line));
}
.slip.pending { --status-color: var(--pending); }
.slip.approved { --status-color: var(--ok); }
.slip.rejected { --status-color: var(--bad); }
.slip.left { --status-color: var(--left); }
.slip.cancelled { --status-color: var(--line); opacity: 0.7; }
@media (max-width: 600px) { .slip { grid-template-columns: 1fr; } }

.slip-head { display: flex; align-items: baseline; gap: 0.6rem; flex-wrap: wrap; }
.slip-name { font-size: 1.15rem; font-weight: 700; }
.slip-class {
  font-family: var(--mono);
  font-weight: 600;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 0 0.4rem;
}
.slip dl { display: grid; grid-template-columns: max-content 1fr; gap: 0.2rem 0.9rem; margin: 0.6rem 0 0; }
.slip dt { color: var(--muted); font-size: 0.85rem; }
.slip dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
.slip-side { display: grid; gap: 0.5rem; align-content: start; justify-items: end; }
@media (max-width: 600px) { .slip-side { justify-items: start; } }
.slip-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
.slip-meta { color: var(--muted); font-size: 0.8rem; text-align: right; }
@media (max-width: 600px) { .slip-meta { text-align: left; } }

.pill {
  font-size: 0.8rem;
  font-weight: 700;
  padding: 0.2rem 0.65rem;
  border-radius: 99px;
  white-space: nowrap;
}
.pill.pending { color: var(--pending); background: var(--pending-bg); }
.pill.approved { color: var(--ok); background: var(--ok-bg); }
.pill.rejected { color: var(--bad); background: var(--bad-bg); }
.pill.left { color: var(--left); background: var(--left-bg); }
.pill.cancelled { color: var(--muted); background: var(--surface-2); }

.guard .slip-name { font-size: 1.4rem; }
.empty {
  border: 1px dashed var(--line);
  border-radius: 12px;
  padding: 24px;
  text-align: center;
  color: var(--muted);
}

/* ---------- Кесте (қолданушылар) ---------- */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 0.55rem 0.6rem; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 0.8rem; color: var(--muted); font-weight: 600; letter-spacing: 0.03em; text-transform: uppercase; }
td .btn { padding: 0.3rem 0.6rem; font-size: 0.85rem; }

dialog {
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
  color: var(--ink);
  width: min(420px, calc(100vw - 32px));
  padding: 22px;
}
dialog::backdrop { background: rgb(10 20 30 / 0.45); }

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%);
  background: var(--ink);
  color: var(--bg);
  padding: 0.65rem 1.1rem;
  border-radius: 10px;
  font-weight: 600;
  z-index: 20;
  max-width: calc(100vw - 32px);
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
