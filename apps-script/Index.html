<!doctype html>
<html lang="kk">
<head>
  <base target="_top">
  <script>
    // Таңдалған режимді бет ашылмай тұрып қоямыз, әйтпесе бет жыпылықтайды
    try {
      var savedTheme = localStorage.getItem('shygu-theme');
      if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
    } catch (e) {}
  </script>
  <meta charset="utf-8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <?!= include('Styles'); ?>
</head>
<body data-title="<?= siteTitle ?>">
  <!-- Кіру беті -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="login-card">
      <button class="theme-toggle" type="button" data-theme-toggle></button>
      <div class="brand">
        <img class="brand-logo logo-light" src="<?!= include('LogoNavy'); ?>" alt="«Білім-инновация» логотипі">
        <img class="brand-logo logo-dark" src="<?!= include('LogoSand'); ?>" alt="«Білім-инновация» логотипі">
        <div>
          <h1>Шығу рұқсаты</h1>
          <p class="muted">Оқушыны сабақтан босату жүйесі</p>
        </div>
      </div>
      <p class="school-name"><?= schoolFullName ?></p>
      <span class="field-label" id="role-label">Кім ретінде кіресіз?</span>
      <div class="segmented" role="radiogroup" aria-labelledby="role-label">
        <input type="radio" name="role" id="role-teacher" value="teacher" checked>
        <label for="role-teacher">Сынып жетекшісі</label>
        <input type="radio" name="role" id="role-guard" value="guard">
        <label for="role-guard">Өткізу бекеті</label>
        <input type="radio" name="role" id="role-zavuch" value="zavuch">
        <label for="role-zavuch">Завуч</label>
      </div>
      <div id="class-field" class="stack">
        <label for="login-class">Сынып</label>
        <select id="login-class">
          <option value="">Жүктелуде…</option>
        </select>
      </div>
      <label for="login-secret" id="secret-label">PIN-код</label>
      <input id="login-secret" type="password" required autocomplete="current-password">
      <p id="login-error" class="error" hidden></p>
      <button class="btn btn-primary" type="submit">Кіру</button>
    </form>
  </main>

  <!-- Негізгі бет -->
  <div id="app-view" hidden>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand small">
          <img class="brand-logo" src="<?!= include('LogoSand'); ?>" alt="">
          <div class="brand-text">
            <strong>Шығу рұқсаты</strong>
            <span class="school-short"><?= schoolShortName ?></span>
          </div>
        </div>
        <nav id="tabs" class="tabs"></nav>
        <div class="who">
          <span id="who-name"></span>
          <span id="who-role" class="role-chip"></span>
          <button class="theme-toggle" type="button" data-theme-toggle></button>
          <button id="btn-password" class="btn btn-ghost" type="button">Құпия сөз</button>
          <button id="btn-logout" class="btn btn-ghost" type="button">Шығу</button>
        </div>
      </div>
    </header>
    <main id="content" class="content"></main>
  </div>

  <!-- Құпия сөзді ауыстыру -->
  <dialog id="password-dialog">
    <form id="password-form" class="stack">
      <h2 id="pw-title">Құпия сөзді ауыстыру</h2>
      <label for="pw-old" id="pw-old-label">Ескі құпия сөз</label>
      <input id="pw-old" type="password" required autocomplete="current-password">
      <label for="pw-new" id="pw-new-label">Жаңа құпия сөз (кемінде 6 таңба)</label>
      <input id="pw-new" type="password" required autocomplete="new-password">
      <p id="pw-error" class="error" hidden></p>
      <div class="row-end">
        <button class="btn btn-ghost" type="button" data-close>Болдырмау</button>
        <button class="btn btn-primary" type="submit">Сақтау</button>
      </div>
    </form>
  </dialog>

  <!-- Оқушының суретін үлкейтіп көру -->
  <dialog id="photo-dialog">
    <img id="photo-dialog-img" alt="">
    <p id="photo-dialog-name"></p>
    <button class="btn btn-ghost" type="button" data-close>Жабу</button>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <?!= include('Script'); ?>
</body>
</html>
