<script>
'use strict';

// ---------- Мәтіндер ----------

const ROLE_NAMES = { teacher: 'Сынып жетекшісі', zavuch: 'Завуч', guard: 'Күзетші' };
const STATUS_NAMES = {
  pending: 'Завучты күтуде',
  approved: 'Рұқсат берілді',
  rejected: 'Рұқсат берілмеді',
  left: 'Мектептен шықты',
  cancelled: 'Қайтарылды',
};
const REASONS = ['Ауырып қалды', 'Дәрігерге', 'Отбасылық жағдай', 'Жарыс / олимпиада', 'Басқа'];
const DESTINATIONS = ['Үйге', 'Емханаға', 'Ауруханаға', 'Басқа'];
const PICKUPS = ['Анасы', 'Әкесі', 'Туысы', 'Өзі барады'];
const REFRESH_MS = 10000;

// ---------- Күй ----------

const state = {
  user: null,
  today: '',
  token: '',
  tab: 'requests',
  date: '',
  requests: [],
  users: [],
  rejectDrafts: new Map(),
  lastPending: null,
};
let timer = null;

// ---------- Көмекшілер ----------

function h(tag, attrs = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c instanceof Node ? c : document.createTextNode(String(c)));
  }
  return el;
}

const $ = (id) => document.getElementById(id);

// Кіру токені осы браузерде сақталады.
const store = {
  get() { try { return localStorage.getItem('shygu-token') || ''; } catch { return state.token || ''; } },
  set(v) { state.token = v; try { v ? localStorage.setItem('shygu-token', v) : localStorage.removeItem('shygu-token'); } catch {} },
};

// Code.gs ішіндегі функцияны шақыру. Токен бірінші аргумент ретінде беріледі.
function call(fn, ...args) {
  return new Promise((resolve, reject) => {
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler((err) => {
        const msg = String((err && err.message) || err || 'Қате шықты. Қайталап көріңіз.').replace(/^Error:\s*/, '');
        if (msg.startsWith('AUTH:')) {
          store.set('');
          showLogin();
          reject(new Error(msg.slice(5)));
        } else {
          reject(new Error(msg));
        }
      })[fn](store.get(), ...args);
  });
}

// Серверден келетін уақыт: "2026-09-28 14:05:31"
function time(stamp) {
  return stamp ? stamp.slice(11, 16) : '';
}

function prettyDate(ymd) {
  const [y, m, d] = ymd.split('-').map(Number);
  const months = ['қаңтар', 'ақпан', 'наурыз', 'сәуір', 'мамыр', 'маусым', 'шілде', 'тамыз', 'қыркүйек', 'қазан', 'қараша', 'желтоқсан'];
  return `${d} ${months[m - 1]} ${y}`;
}

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.hidden = true), 3000);
}

function beep() {
  try {
    const ctx = new AudioContext();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.frequency.value = 880;
    g.gain.setValueAtTime(0.15, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
    o.connect(g).connect(ctx.destination);
    o.start();
    o.stop(ctx.currentTime + 0.4);
  } catch {}
}

// ---------- Жарық / қараңғы режим ----------

function currentTheme() {
  const set = document.documentElement.getAttribute('data-theme');
  if (set) return set;
  return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}

function renderThemeButtons() {
  const dark = currentTheme() === 'dark';
  document.querySelectorAll('[data-theme-toggle]').forEach((btn) => {
    btn.replaceChildren(
      h('span', { class: 'icon', 'aria-hidden': 'true' }, dark ? '☀' : '☾'),
      h('span', { class: 'label' }, dark ? 'Жарық' : 'Қараңғы'));
    btn.title = dark ? 'Жарық режимге ауысу' : 'Қараңғы режимге ауысу';
  });
}

document.querySelectorAll('[data-theme-toggle]').forEach((btn) => btn.addEventListener('click', () => {
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try { localStorage.setItem('shygu-theme', next); } catch {}
  renderThemeButtons();
}));
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', renderThemeButtons);
renderThemeButtons();

// ---------- Кіру / шығу ----------

// Соңғы таңдалған рөл мен сынып осы құрылғыда есте қалады.
const prefs = {
  get(k) { try { return localStorage.getItem('shygu-' + k) || ''; } catch { return ''; } },
  set(k, v) { try { localStorage.setItem('shygu-' + k, v); } catch {} },
};

function loginRole() {
  return document.querySelector('input[name=role]:checked').value;
}

function updateLoginForm() {
  const teacher = loginRole() === 'teacher';
  $('class-field').hidden = !teacher;
  $('login-class').required = teacher;
  $('secret-label').textContent = teacher ? 'PIN-код' : 'Құпия сөз';
  $('login-secret').inputMode = teacher ? 'numeric' : 'text';
  $('login-secret').maxLength = teacher ? 6 : 100;
  $('login-secret').value = '';
  $('login-error').hidden = true;
}

async function loadClasses() {
  const select = $('login-class');
  try {
    const { classes } = await new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).apiLoginOptions());
    const saved = prefs.get('class');
    select.replaceChildren(
      h('option', { value: '' }, classes.length ? 'Сыныпты таңдаңыз' : 'Сыныптар әлі қосылмаған'),
      ...classes.map((c) => h('option', { value: c, selected: c === saved }, c)));
  } catch {
    select.replaceChildren(h('option', { value: '' }, 'Жүктелмеді. Бетті жаңартыңыз.'));
  }
}

document.querySelectorAll('input[name=role]').forEach((r) => r.addEventListener('change', updateLoginForm));

function showLogin() {
  clearInterval(timer);
  state.user = null;
  $('app-view').hidden = true;
  $('login-view').hidden = false;
  const savedRole = prefs.get('role');
  if (savedRole && $('role-' + savedRole)) $('role-' + savedRole).checked = true;
  updateLoginForm();
  loadClasses();
  $('login-secret').focus();
}

$('login-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const err = $('login-error');
  err.hidden = true;
  try {
    const btn = e.target.querySelector('button[type=submit]');
    btn.disabled = true;
    const res = await new Promise((resolve, reject) =>
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)
        .apiLogin(loginRole(), $('login-class').value, $('login-secret').value)
    ).finally(() => (btn.disabled = false));
    store.set(res.token);
    prefs.set('role', loginRole());
    if (loginRole() === 'teacher') prefs.set('class', $('login-class').value);
    $('login-secret').value = '';
    await start();
  } catch (ex) {
    err.textContent = String(ex.message || ex).replace(/^Error:\s*/, '');
    err.hidden = false;
  }
});

$('btn-logout').addEventListener('click', async () => {
  await call('apiLogout').catch(() => {});
  store.set('');
  showLogin();
});

$('btn-password').addEventListener('click', () => {
  const pin = state.user.role === 'teacher';
  $('password-form').reset();
  $('pw-title').textContent = pin ? 'PIN-кодты ауыстыру' : 'Құпия сөзді ауыстыру';
  $('pw-old-label').textContent = pin ? 'Ескі PIN-код' : 'Ескі құпия сөз';
  $('pw-new-label').textContent = pin ? 'Жаңа PIN-код (4–6 сан)' : 'Жаңа құпия сөз (кемінде 6 таңба)';
  $('pw-old').inputMode = $('pw-new').inputMode = pin ? 'numeric' : 'text';
  $('pw-error').hidden = true;
  $('password-dialog').showModal();
});
$('password-dialog').querySelector('[data-close]').addEventListener('click', () => $('password-dialog').close());
$('password-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  try {
    await call('apiChangePassword', $('pw-old').value, $('pw-new').value);
    $('password-dialog').close();
    toast(state.user.role === 'teacher' ? 'PIN-код ауыстырылды' : 'Құпия сөз ауыстырылды');
  } catch (ex) {
    $('pw-error').textContent = ex.message;
    $('pw-error').hidden = false;
  }
});

async function start() {
  if (!store.get()) return showLogin();
  const me = await call('apiMe');
  state.user = me.user;
  state.today = me.today;
  state.date = me.today;
  state.tab = 'requests';
  state.lastPending = null;
  state.students = null;
  $('login-view').hidden = true;
  $('app-view').hidden = false;
  $('who-name').textContent = me.user.className ? `${me.user.className} · ${me.user.name}` : me.user.name;
  $('btn-password').textContent = me.user.role === 'teacher' ? 'PIN-код' : 'Құпия сөз';
  $('who-role').textContent = ROLE_NAMES[me.user.role];
  renderTabs();
  await renderPage();
  clearInterval(timer);
  timer = setInterval(refresh, REFRESH_MS);
}

// ---------- Беттер ----------

function renderTabs() {
  const tabs = [['requests', state.user.role === 'guard' ? 'Шығатын оқушылар' : 'Өтінімдер']];
  if (state.user.role === 'zavuch') tabs.push(['report', 'Есеп'], ['users', 'Қолданушылар']);
  // Бір ғана бет болса, қойындыларды көрсетудің қажеті жоқ
  $('tabs').hidden = tabs.length < 2;
  $('tabs').replaceChildren(
    ...tabs.map(([id, label]) =>
      h('button', {
        type: 'button',
        'aria-current': state.tab === id ? 'page' : null,
        onclick: () => { state.tab = id; renderTabs(); renderPage(); },
      }, label))
  );
}

async function renderPage() {
  const content = $('content');
  if (state.tab === 'report') {
    content.replaceChildren(h('p', { class: 'muted' }, 'Есеп дайындалуда…'));
    await renderReport();
    return;
  }
  if (state.tab === 'users') {
    content.replaceChildren(h('p', { class: 'muted' }, 'Жүктелуде…'));
    await loadUsers();
    content.replaceChildren(usersPage());
    return;
  }
  await loadRequests();
  const role = state.user.role;
  if (role === 'teacher') {
    if (!state.students) state.students = await call('apiStudents').catch(() => []);
    content.replaceChildren(teacherPage());
  }
  else if (role === 'zavuch') content.replaceChildren(zavuchPage());
  else content.replaceChildren(guardPage());
  renderList();
}

async function refresh() {
  if (!state.user || state.tab !== 'requests' || document.hidden) return;
  try {
    await loadRequests();
    renderList();
  } catch {}
}

async function loadRequests() {
  const data = await call('apiListRequests', state.date);
  state.requests = data.requests;
  if (data.today !== state.today) {
    // Түн ауып, жаңа күн басталса
    if (state.date === state.today) state.date = data.today;
    state.today = data.today;
  }
  const pending = state.requests.filter((r) => r.status === 'pending').length;
  const approved = state.requests.filter((r) => r.status === 'approved').length;
  const alertCount = state.user.role === 'zavuch' ? pending : state.user.role === 'guard' ? approved : 0;
  if (state.lastPending !== null && alertCount > state.lastPending) beep();
  state.lastPending = alertCount;
  document.title = (alertCount ? `(${alertCount}) ` : '') + (document.body.dataset.title || 'Шығу рұқсаты');
}

function dateHead(title, subtitle) {
  const canPick = state.user.role !== 'guard';
  return h('div', { class: 'page-head' },
    h('div', {},
      h('h1', {}, title),
      h('p', { class: 'muted' }, subtitle || prettyDate(state.date) + (state.date === state.today ? ' · бүгін' : ''))),
    canPick && h('div', { class: 'stack' },
      h('label', { for: 'date-pick' }, 'Күні'),
      h('input', {
        id: 'date-pick', type: 'date', value: state.date, max: state.today,
        onchange: (e) => { state.date = e.target.value || state.today; renderPage(); },
      })));
}

// --- Сынып жетекшісі ---

function chipGroup(name, options, required) {
  return h('div', { class: 'chips', role: 'radiogroup' },
    options.map((opt, i) => [
      h('input', { type: 'radio', name, id: `${name}-${i}`, value: opt, required: required && i === 0 }),
      h('label', { for: `${name}-${i}` }, opt),
    ]));
}

const OTHER_STUDENT = '__other';

// Оқушыны сынып тізімінен таңдау. Тізімде жоқ болса, қолмен жазуға болады.
function studentField() {
  const names = state.students || [];
  const input = h('input', { id: 'f-student', name: 'student', required: !names.length, hidden: !!names.length, placeholder: 'Аты-жөнін жазыңыз' });
  if (!names.length) {
    return h('div', { class: 'full' }, h('label', { for: 'f-student' }, 'Оқушының аты-жөні'), input);
  }
  const select = h('select', { id: 'f-student-select', required: true, onchange: syncStudentField },
    h('option', { value: '' }, `Оқушыны таңдаңыз (${names.length})`),
    names.map((n) => h('option', { value: n }, n)),
    h('option', { value: OTHER_STUDENT }, 'Тізімде жоқ оқушы…'));
  return h('div', { class: 'full stack' },
    h('label', { for: 'f-student-select' }, 'Оқушы'),
    h('div', { class: 'student-pick' }, h('div', { id: 'f-student-photo' }), select),
    input);
}

function syncStudentField() {
  const select = $('f-student-select');
  const input = $('f-student');
  if (!select) return;
  const other = select.value === OTHER_STUDENT;
  input.hidden = !other;
  input.required = other;
  input.value = other ? '' : select.value;
  if (other) input.focus();
  const holder = $('f-student-photo');
  holder.replaceChildren(select.value && !other ? avatar(state.user.className, select.value, 'sm') : '');
}

function teacherPage() {
  const form = h('form', { class: 'panel stack', id: 'request-form', onsubmit: submitRequest },
    h('h2', {}, 'Жаңа өтінім'),
    h('p', { class: 'muted' }, 'Толтырып жіберіңіз — завуч бірден көреді.'),
    h('div', { class: 'form-grid' },
      studentField(),
      h('div', {},
        h('label', { for: 'f-class' }, 'Сыныбы'),
        h('input', { id: 'f-class', name: 'className', required: true, value: state.user.className || '', readonly: !!state.user.className, placeholder: '10А' })),
      h('div', {},
        h('label', { for: 'f-phone' }, 'Ата-анасының телефоны'),
        h('input', { id: 'f-phone', name: 'pickupPhone', type: 'tel', placeholder: '+7 7__ ___ __ __' })),
      h('div', { class: 'full' }, h('label', {}, 'Себебі'), chipGroup('reason', REASONS, true)),
      h('div', { class: 'full' },
        h('label', { for: 'f-note' }, 'Қосымша (міндетті емес)'),
        h('textarea', { id: 'f-note', name: 'reasonNote', placeholder: 'Мысалы: басы ауырады, температурасы 38' })),
      h('div', { class: 'full' }, h('label', {}, 'Қайда барады'), chipGroup('destination', DESTINATIONS, true)),
      h('div', { class: 'full' }, h('label', {}, 'Кім алып кетеді'), chipGroup('pickup', PICKUPS, false))),
    h('p', { class: 'error', id: 'form-error', hidden: true }),
    h('button', { class: 'btn btn-primary btn-big', type: 'submit' }, 'Завучқа жіберу'));

  return h('div', { class: 'stack', style: 'gap:1.25rem' },
    dateHead('Менің өтінімдерім'),
    h('div', { class: 'teacher-grid' },
      state.date === state.today ? form : h('div', { class: 'empty' }, 'Өткен күннің тізімі. Жаңа өтінімді тек бүгінге жіберуге болады.'),
      h('div', { class: 'list', id: 'list' })));
}

async function submitRequest(e) {
  e.preventDefault();
  const form = e.target;
  const fd = new FormData(form);
  const btn = form.querySelector('button[type=submit]');
  const err = $('form-error');
  err.hidden = true;
  btn.disabled = true;
  try {
    await call('apiCreateRequest', Object.fromEntries(fd));
    const cls = fd.get('className');
    form.reset();
    $('f-class').value = cls;
    syncStudentField();
    toast('Өтінім завучқа жіберілді');
    await loadRequests();
    renderList();
  } catch (ex) {
    err.textContent = ex.message;
    err.hidden = false;
  } finally {
    btn.disabled = false;
  }
}

// --- Завуч ---

function zavuchPage() {
  return h('div', { class: 'stack', style: 'gap:1.25rem' },
    dateHead('Сабақтан босату өтінімдері'),
    h('div', { class: 'counters', id: 'counters' }),
    h('div', { class: 'list', id: 'list' }));
}

// --- Күзетші ---

function guardPage() {
  return h('div', { class: 'stack guard', style: 'gap:1.25rem' },
    dateHead('Мектептен шығуға рұқсат барлар'),
    h('div', { class: 'list', id: 'list' }));
}

// --- Тізім ---

function renderList() {
  const list = $('list');
  if (!list) return;
  const role = state.user.role;
  const rs = state.requests;
  const by = (s) => rs.filter((r) => r.status === s);

  if (role === 'zavuch') {
    const c = $('counters');
    c.replaceChildren(
      ...[['pending', 'Күтуде'], ['approved', 'Рұқсат берілді'], ['left', 'Мектептен шықты'], ['rejected', 'Бас тартылды']]
        .map(([s, label]) => h('div', { class: `counter ${s}` }, h('b', {}, by(s).length), h('span', {}, label))));
    list.replaceChildren(
      section('Шешім күтіп тұр', by('pending'), 'Жаңа өтінім жоқ.'),
      section('Қаралған өтінімдер', rs.filter((r) => r.status !== 'pending'), 'Әзірге ештеңе жоқ.'));
    return;
  }
  if (role === 'guard') {
    list.replaceChildren(
      section('Шығаруға болады', by('approved'), 'Қазір рұқсаты бар оқушы жоқ.'),
      section('Мектептен шықты', by('left'), 'Әзірге ешкім шыққан жоқ.'));
    return;
  }
  list.replaceChildren(
    h('h2', {}, 'Жіберілген өтінімдер'),
    ...(rs.length ? rs.map(slip) : [h('div', { class: 'empty' }, 'Бұл күні өтінім жіберілмеген.')]));
}

function section(title, items, emptyText) {
  return h('div', { class: 'list' },
    h('div', { class: 'section-title' }, h('h2', {}, title), h('span', { class: 'count' }, items.length)),
    items.length ? items.map(slip) : h('div', { class: 'empty' }, emptyText));
}

// ---------- Оқушының суреті ----------

const photoCache = new Map(); // "10А|Аты-жөні" -> data: URI немесе '' (суреті жоқ)
const photoLoading = new Map();

function initials(name) {
  return name.split(' ').filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
}

function fillAvatar(el, uri, name) {
  el.replaceChildren(h('img', { src: uri, alt: name, loading: 'lazy' }));
  el.classList.add('has-photo');
  el.removeAttribute('aria-hidden');
  el.setAttribute('role', 'button');
  el.setAttribute('tabindex', '0');
  el.setAttribute('aria-label', `${name}: суретті үлкейту`);
  const open = () => {
    $('photo-dialog-img').src = uri;
    $('photo-dialog-img').alt = name;
    $('photo-dialog-name').textContent = name;
    $('photo-dialog').showModal();
  };
  el.addEventListener('click', open);
  el.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); open(); } });
}

$('photo-dialog').querySelector('[data-close]').addEventListener('click', () => $('photo-dialog').close());
$('photo-dialog').addEventListener('click', (e) => { if (e.target === $('photo-dialog')) $('photo-dialog').close(); });

function loadPhoto(className, name) {
  const key = `${className}|${name}`;
  if (!photoLoading.has(key)) {
    photoLoading.set(key, call('apiPhoto', className, name)
      .catch(() => '')
      .then((uri) => { photoCache.set(key, uri || ''); return uri || ''; }));
  }
  return photoLoading.get(key);
}

// Суреттің орнында алдымен аты-жөнінің бас әріптері тұрады, сурет жүктелгенде ауысады.
function avatar(className, name, size = 'md') {
  const key = `${className}|${name}`;
  const el = h('div', { class: `avatar avatar-${size}`, 'data-photo-key': key, 'aria-hidden': 'true' }, initials(name));
  const cached = photoCache.get(key);
  if (cached) {
    fillAvatar(el, cached, name);
  } else if (cached === undefined) {
    loadPhoto(className, name).then((uri) => {
      if (!uri) return;
      document.querySelectorAll('[data-photo-key]').forEach((node) => {
        if (node.dataset.photoKey === key && !node.classList.contains('has-photo')) fillAvatar(node, uri, name);
      });
    });
  }
  return el;
}

function slip(r) {
  const role = state.user.role;
  const isToday = state.date === state.today;
  const rows = [
    ['Себебі', r.reason + (r.reasonNote ? ` — ${r.reasonNote}` : '')],
    ['Қайда', r.destination],
    ['Алып кетеді', r.pickup || '—'],
    r.pickupPhone && ['Телефон', r.pickupPhone],
    role !== 'teacher' && ['Жетекшісі', r.teacherName],
    r.decisionNote && ['Завуч ескертпесі', r.decisionNote],
  ].filter(Boolean);

  const meta = [`Жіберілді ${time(r.createdAt)}`];
  if (r.decidedAt) meta.push(`${r.status === 'rejected' ? 'Бас тартты' : 'Рұқсат'} ${time(r.decidedAt)} · ${r.decidedBy}`);
  if (r.leftAt) meta.push(`Шықты ${time(r.leftAt)} · ${r.guardName}`);

  return h('article', { class: `slip ${r.status}` },
    h('div', { class: 'slip-main' },
      avatar(r.className, r.student, role === 'guard' ? 'lg' : 'md'),
      h('div', {},
        h('div', { class: 'slip-head' },
          h('span', { class: 'slip-name' }, r.student),
          h('span', { class: 'slip-class' }, r.className)),
        h('dl', {}, rows.map(([k, v]) => [h('dt', {}, k), h('dd', {}, v)])))),
    h('div', { class: 'slip-side' },
      h('span', { class: `pill ${r.status}` }, STATUS_NAMES[r.status]),
      isToday && actions(r),
      h('div', { class: 'slip-meta' }, meta.map((m) => h('div', {}, m)))));
}

function actions(r) {
  const role = state.user.role;
  if (role === 'zavuch' && r.status === 'pending') {
    if (state.rejectDrafts.has(r.id)) {
      const input = h('input', {
        placeholder: 'Себебі (міндетті емес)', value: state.rejectDrafts.get(r.id),
        oninput: (e) => state.rejectDrafts.set(r.id, e.target.value),
      });
      return h('div', { class: 'stack' },
        input,
        h('div', { class: 'slip-actions' },
          h('button', { class: 'btn btn-ghost', type: 'button', onclick: () => { state.rejectDrafts.delete(r.id); renderList(); } }, 'Артқа'),
          h('button', { class: 'btn btn-bad', type: 'button', onclick: (e) => act(e, r, 'reject', { note: input.value }) }, 'Бас тартуды растау')));
    }
    return h('div', { class: 'slip-actions' },
      h('button', { class: 'btn btn-bad', type: 'button', onclick: () => { state.rejectDrafts.set(r.id, ''); renderList(); } }, '✕ Бас тарту'),
      h('button', { class: 'btn btn-ok btn-big', type: 'button', onclick: (e) => act(e, r, 'approve') }, '✓ Рұқсат беру'));
  }
  if (role === 'guard' && r.status === 'approved') {
    return h('button', { class: 'btn btn-primary btn-big', type: 'button', onclick: (e) => act(e, r, 'leave') }, 'Шығып кетті');
  }
  if (role === 'teacher' && r.status === 'pending') {
    return h('button', { class: 'btn btn-ghost', type: 'button', onclick: (e) => act(e, r, 'cancel') }, 'Қайтарып алу');
  }
  return null;
}

async function act(e, r, verb, body = {}) {
  e.currentTarget.disabled = true;
  try {
    await call('apiRequestAction', r.id, verb, body.note || '');
    state.rejectDrafts.delete(r.id);
    toast({ approve: 'Рұқсат берілді', reject: 'Бас тартылды', leave: 'Белгіленді: мектептен шықты', cancel: 'Өтінім қайтарылды' }[verb]);
  } catch (ex) {
    toast(ex.message);
  }
  await loadRequests();
  renderList();
}

// --- Айлық есеп (завуч) ---

const MONTHS = ['Қаңтар', 'Ақпан', 'Наурыз', 'Сәуір', 'Мамыр', 'Маусым', 'Шілде', 'Тамыз', 'Қыркүйек', 'Қазан', 'Қараша', 'Желтоқсан'];
const OFTEN = 3; // айына осыдан көп шықса, «жиі» деп белгілейміз

function monthLabel(ym) {
  const [y, m] = ym.split('-').map(Number);
  return `${MONTHS[m - 1]} ${y}`;
}

function lastMonths(count) {
  const [y, m] = state.today.split('-').map(Number);
  const out = [];
  for (let i = 0; i < count; i++) {
    const d = new Date(Date.UTC(y, m - 1 - i, 1));
    out.push(`${d.getUTCFullYear()}-${String(d.getUTCMonth() + 1).padStart(2, '0')}`);
  }
  return out;
}

async function renderReport() {
  if (!state.reportMonth) state.reportMonth = state.today.slice(0, 7);
  if (!state.reportFilter) state.reportFilter = { cls: '', q: '' };
  const report = await call('apiMonthReport', state.reportMonth);
  $('content').replaceChildren(reportPage(report));
  renderStudentRows(report);
}

function reportPage(rep) {
  const picker = h('div', { class: 'report-tools' },
    h('div', { class: 'stack' },
      h('label', { for: 'report-month' }, 'Ай'),
      h('select', {
        id: 'report-month',
        onchange: (e) => { state.reportMonth = e.target.value; renderPage(); },
      }, lastMonths(12).map((m) => h('option', { value: m, selected: m === rep.month }, monthLabel(m))))),
    h('button', { class: 'btn btn-ghost', type: 'button', id: 'report-export', onclick: (e) => exportReport(e, rep.month) }, 'Кестеге шығару'),
    h('span', { id: 'report-export-link' }));

  const uniqueStudents = rep.students.length;
  const counters = h('div', { class: 'counters' },
    [[rep.totals.all, 'Барлық өтінім', ''], [rep.exits, 'Шығуға рұқсат', 'approved'],
     [rep.totals.rejected, 'Бас тартылды', 'rejected'], [uniqueStudents, 'Оқушы шықты', 'left']]
      .map(([n, label, cls]) => h('div', { class: `counter ${cls}` }, h('b', {}, n), h('span', {}, label))));

  const classes = rep.students.map((s) => s.className).filter((c, i, a) => a.indexOf(c) === i)
    .sort((a, b) => (parseInt(a, 10) - parseInt(b, 10)) || a.localeCompare(b, 'kk'));

  return h('div', { class: 'stack', style: 'gap:1.25rem' },
    h('div', { class: 'page-head' },
      h('div', {}, h('h1', {}, `Айлық есеп`), h('p', { class: 'muted' }, `${monthLabel(rep.month)} · рұқсат берілген шығулар бойынша`)),
      picker),
    counters,
    rep.exits ? [
      h('div', { class: 'report-grid' },
        h('section', { class: 'panel stack' }, h('h2', {}, 'Себептер'), barList(rep.byReason, rep.exits)),
        h('section', { class: 'panel stack' }, h('h2', {}, 'Сыныптар'), barList(rep.byClass, rep.exits))),
      h('section', { class: 'panel stack' }, h('h2', {}, 'Күн бойынша'), dayChart(rep)),
      h('section', { class: 'panel stack' },
        h('div', { class: 'report-table-head' },
          h('h2', {}, 'Оқушылар'),
          h('div', { class: 'report-filters' },
            h('select', {
              id: 'report-class', 'aria-label': 'Сынып',
              onchange: (e) => { state.reportFilter.cls = e.target.value; renderStudentRows(rep); },
            }, h('option', { value: '' }, 'Барлық сынып'), classes.map((c) => h('option', { value: c, selected: c === state.reportFilter.cls }, c))),
            h('input', {
              id: 'report-search', type: 'search', placeholder: 'Аты бойынша іздеу', 'aria-label': 'Аты бойынша іздеу', value: state.reportFilter.q,
              oninput: (e) => { state.reportFilter.q = e.target.value; renderStudentRows(rep); },
            }))),
        h('p', { class: 'muted' }, `Айына ${OFTEN} рет не одан көп шыққан оқушылар «жиі» деп белгіленеді.`),
        h('div', { class: 'table-wrap' },
          h('table', { class: 'report-table' },
            h('thead', {}, h('tr', {}, ['Оқушы', 'Сынып', 'Рет', 'Себептері', 'Соңғы рет'].map((t) => h('th', {}, t)))),
            h('tbody', { id: 'report-rows' }))))
    ] : h('div', { class: 'empty' }, `${monthLabel(rep.month)} айында шығуға рұқсат берілген өтінім жоқ.`));
}

// Көлденең жолақтар: бір түс, мәні жолақтың жанында жазылады
function barList(pairs, total) {
  const max = Math.max(...pairs.map((p) => p[1]), 1);
  return h('div', { class: 'barlist' }, pairs.map(([label, n]) =>
    h('div', { class: 'bar-row', title: `${label}: ${n} (${Math.round((n / total) * 100)}%)` },
      h('span', { class: 'bar-label' }, label),
      h('span', { class: 'bar-track' }, h('span', { class: 'bar-fill', style: `width:${(n / max) * 100}%` })),
      h('span', { class: 'bar-value' }, n))));
}

// Айдың әр күні бір баған. Меңзер апарғанда не басқанда сол күннің саны шығады.
function dayChart(rep) {
  const [y, m] = rep.month.split('-').map(Number);
  const days = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const counts = Object.fromEntries(rep.byDay);
  const max = Math.max(...rep.byDay.map((d) => d[1]), 1);
  const top = Math.max(2, Math.ceil(max / 2) * 2);
  const tip = h('div', { class: 'chart-tip', hidden: true });
  const show = (col, text) => {
    tip.textContent = text;
    tip.hidden = false;
    const box = col.parentElement.getBoundingClientRect();
    const r = col.getBoundingClientRect();
    tip.style.left = `${Math.min(Math.max(r.left - box.left + r.width / 2, 40), box.width - 40)}px`;
  };
  const cols = [];
  for (let d = 1; d <= days; d++) {
    const date = `${rep.month}-${String(d).padStart(2, '0')}`;
    const n = counts[date] || 0;
    const weekday = new Date(Date.UTC(y, m - 1, d)).getUTCDay();
    const text = `${d} ${MONTHS[m - 1].toLowerCase()}: ${n} оқушы`;
    const col = h('div', {
      class: `day-col${weekday === 0 || weekday === 6 ? ' weekend' : ''}`, tabindex: n ? '0' : null, 'aria-label': text,
      onmouseenter: (e) => show(e.currentTarget, text), onfocus: (e) => show(e.currentTarget, text),
      onmouseleave: () => (tip.hidden = true), onblur: () => (tip.hidden = true),
    },
      h('span', { class: 'day-bar', style: `height:${(n / top) * 100}%` }),
      h('span', { class: 'day-num' }, d % 5 === 1 || d === days ? d : ''));
    cols.push(col);
  }
  return h('div', { class: 'daychart' },
    h('div', { class: 'day-grid' },
      h('span', { class: 'grid-line', style: 'bottom:100%' }, h('i', {}, top)),
      h('span', { class: 'grid-line', style: 'bottom:50%' }, h('i', {}, top / 2)),
      h('span', { class: 'grid-line base', style: 'bottom:0' }, h('i', {}, 0))),
    h('div', { class: 'day-cols' }, cols, tip));
}

function renderStudentRows(rep) {
  const body = $('report-rows');
  if (!body) return;
  const { cls, q } = state.reportFilter;
  const needle = q.trim().toLowerCase();
  const list = rep.students.filter((s) => (!cls || s.className === cls) && (!needle || s.student.toLowerCase().includes(needle)));
  body.replaceChildren(...(list.length ? list.map((s) => h('tr', { class: s.count >= OFTEN ? 'often' : '' },
    h('td', {}, h('div', { class: 'report-student' }, avatar(s.className, s.student, 'sm'), h('span', {}, s.student))),
    h('td', { class: 'mono' }, s.className),
    h('td', { class: 'mono' }, h('b', {}, s.count), s.count >= OFTEN ? h('span', { class: 'often-badge' }, '⚠ жиі') : ''),
    h('td', {}, h('div', { class: 'reason-chips' }, Object.entries(s.reasons).sort((a, b) => b[1] - a[1])
      .map(([r, n]) => h('span', { class: 'reason-chip' }, n > 1 ? `${r} · ${n}` : r)))),
    h('td', { class: 'mono' }, s.last ? `${Number(s.last.slice(8, 10))} ${MONTHS[Number(s.last.slice(5, 7)) - 1].toLowerCase()}, ${s.last.slice(11, 16)}` : '—')))
    : [h('tr', {}, h('td', { colspan: '5', class: 'muted' }, 'Ешкім табылмады.'))]));
}

async function exportReport(e, month) {
  const btn = e.currentTarget;
  btn.disabled = true;
  try {
    const url = await call('apiExportMonthReport', month);
    $('report-export-link').replaceChildren(h('a', { href: url, target: '_blank', rel: 'noopener' }, 'Кестені ашу →'));
    toast('Есеп кестеге шығарылды');
  } catch (ex) {
    toast(ex.message);
  } finally {
    btn.disabled = false;
  }
}

// --- Қолданушылар (завуч) ---

async function loadUsers() {
  state.users = await call('apiListUsers');
}

function usersPage() {
  const form = h('form', { class: 'panel stack', onsubmit: addUser },
    h('h2', {}, 'Жаңа қолданушы қосу'),
    h('div', { class: 'form-grid' },
      h('div', { class: 'full' },
        h('label', { for: 'u-role' }, 'Рөлі'),
        h('select', { id: 'u-role', name: 'role', onchange: updateUserForm },
          Object.entries(ROLE_NAMES).map(([v, l]) => h('option', { value: v }, l)))),
      h('div', { id: 'u-class-wrap' },
        h('label', { for: 'u-class' }, 'Сыныбы'),
        h('input', { id: 'u-class', name: 'className', required: true, placeholder: '10А' })),
      h('div', { id: 'u-name-wrap' },
        h('label', { for: 'u-name', id: 'u-name-label' }, 'Жетекшінің аты-жөні'),
        h('input', { id: 'u-name', name: 'name', required: true, placeholder: 'Серікова Айгүл' })),
      h('div', { id: 'u-secret-wrap' },
        h('label', { for: 'u-password', id: 'u-password-label' }, 'PIN-код (4–6 сан)'),
        h('input', { id: 'u-password', name: 'password', required: true, inputmode: 'numeric', pattern: '\\d{4,6}', maxlength: '6', placeholder: '1234' }))),
    h('p', { class: 'error', id: 'u-error', hidden: true }),
    h('div', {}, h('button', { class: 'btn btn-primary', type: 'submit' }, 'Қосу')));

  const byClass = (a, b) => (parseInt(a.className, 10) - parseInt(b.className, 10)) || a.className.localeCompare(b.className, 'kk');
  const order = { zavuch: 0, guard: 1, teacher: 2 };
  const users = state.users.slice().sort((a, b) => (order[a.role] - order[b.role]) || (a.role === 'teacher' ? byClass(a, b) : 0));

  const table = h('div', { class: 'panel stack' },
    h('h2', {}, 'Барлық қолданушылар'),
    h('div', { class: 'table-wrap' },
      h('table', {},
        h('thead', {}, h('tr', {}, ['Рөлі', 'Сынып', 'Аты-жөні', 'Оқушылар', ''].map((t) => h('th', {}, t)))),
        h('tbody', {}, users.map((u) => h('tr', {},
          h('td', {}, ROLE_NAMES[u.role]),
          h('td', { class: 'mono' }, u.className || '—'),
          h('td', {}, u.name),
          h('td', { class: 'mono' }, u.role === 'teacher' ? (u.studentCount || h('span', { class: 'error' }, 'тізім жоқ')) : '—'),
          h('td', {}, u.id === state.user.id ? h('span', { class: 'muted' }, 'сіз') : userActions(u))))))));

  return h('div', { class: 'stack', style: 'gap:1.25rem' },
    h('div', { class: 'page-head' }, h('div', {},
      h('h1', {}, 'Қолданушылар'),
      h('p', { class: 'muted' }, 'Әр сыныпқа PIN-код, күзетшіге өз құпия сөзін беріңіз.'))),
    form, table);
}

function userActions(u) {
  const pin = u.role === 'teacher';
  const pw = h('input', { placeholder: pin ? 'Жаңа PIN' : 'Жаңа құпия сөз', inputmode: pin ? 'numeric' : null, maxlength: pin ? '6' : null, style: 'width:10rem' });
  return h('div', { class: 'slip-actions' },
    pw,
    h('button', {
      class: 'btn btn-ghost', type: 'button',
      onclick: async () => {
        try {
          await call('apiResetPassword', u.id, pw.value);
          pw.value = '';
          toast(pin ? 'PIN-код ауыстырылды' : 'Құпия сөз ауыстырылды');
        } catch (ex) { toast(ex.message); }
      },
    }, 'Ауыстыру'),
    h('button', {
      class: 'btn btn-bad', type: 'button',
      onclick: async (e) => {
        const btn = e.currentTarget;
        if (btn.dataset.confirm !== '1') {
          btn.dataset.confirm = '1';
          btn.textContent = 'Растау: өшіру';
          return;
        }
        try {
          await call('apiDeleteUser', u.id);
          toast('Қолданушы өшірілді');
          await loadUsers();
          $('content').replaceChildren(usersPage());
        } catch (ex) { toast(ex.message); }
      },
    }, 'Өшіру'));
}

function updateUserForm() {
  const role = $('u-role').value;
  const pin = role === 'teacher';
  $('u-class-wrap').hidden = !pin;
  $('u-class').required = pin;
  $('u-name-label').textContent = pin ? 'Жетекшінің аты-жөні' : 'Аты-жөні';
  $('u-name').placeholder = pin ? 'Серікова Айгүл' : role === 'guard' ? 'Бекжанов Ерлан' : 'Аты-жөні';
  const pw = $('u-password');
  $('u-password-label').textContent = pin ? 'PIN-код (4–6 сан)' : 'Құпия сөз (кемінде 6 таңба)';
  pw.value = '';
  pw.inputMode = pin ? 'numeric' : 'text';
  pin ? pw.setAttribute('pattern', '\\d{4,6}') : pw.removeAttribute('pattern');
  pw.maxLength = pin ? 6 : 100;
  pw.minLength = pin ? 4 : 6;
  pw.placeholder = pin ? '1234' : '';
}

async function addUser(e) {
  e.preventDefault();
  const err = $('u-error');
  err.hidden = true;
  try {
    await call('apiAddUser', Object.fromEntries(new FormData(e.target)));
    toast('Қолданушы қосылды');
    await loadUsers();
    $('content').replaceChildren(usersPage());
  } catch (ex) {
    err.textContent = ex.message;
    err.hidden = false;
  }
}

start().catch(() => showLogin());
