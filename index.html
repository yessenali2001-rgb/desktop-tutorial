<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Кабинет ученика</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#111233">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Кабинет">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="style.css">
  <script>
    // Сохранённая тема (белая / чёрная) применяется до отрисовки, чтобы экран не мигал
    try {
      var t = localStorage.getItem("theme");
      if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <!-- Логотип: эмблема BIL (logo.png). Если файла нет, показывается надпись «BIL» -->
      <span class="logo"><img src="logo.png" alt="BIL" onerror="this.remove()"><span class="logo-text">BIL</span></span>
      <div>
        <div class="brand-title">Кабинет ученика</div>
        <div class="brand-sub" id="class-name"></div>
      </div>
    </div>
    <div class="topbar-right">
      <div class="user-box" id="user-box" hidden>
        <span id="user-name"></span>
        <button class="btn btn-ghost" id="logout-btn">Выйти</button>
      </div>
      <button class="theme-btn" id="theme-btn" type="button" title="Белый / чёрный фон"></button>
    </div>
  </header>

  <main id="app"></main>

  <script src="config.js"></script>
  <script src="gallup.js"></script>
  <script src="app.js"></script>
</body>
</html>
